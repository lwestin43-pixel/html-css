<!DOCTYPE html>
<html lang="en">
<head>

        table {width: 600px; border-collapse: collapse;}

        td,th {border: 1px solid black; padding: 10px;}

        thead {background-color: beige; color: black;}

            <td>

<tr>

</tr>

</html>
