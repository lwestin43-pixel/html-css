<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 005</title>
    <style>
body {font-family: Arial, Helvetica, sans-serif;}
table {width: 500px; border-collapse: collapse; text-align: center;}
caption {font-size: 1.3em; font-weight: bolder; padding: 8px;}
th, td {border: 1px solid black; padding: 8px; }

col.cnome {background-color: lightblue;}
    </style>
</head>
<body>

            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>

        </tr>

        </tr>

            <td>Firmino</td>

            <td>56</td>
            <td>Faxineiro</td>
        </tr>
        <tr>
            <td>Andressa</td>
            <td>F</td>
            <td>29</td>
            <td>Enfermeira</td>
        </tr>
        <tr>
            <td>Marcos</td>

    </table>
</body>
</html>
