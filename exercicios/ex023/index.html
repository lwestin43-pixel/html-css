<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela HTML</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif;}
        
        td { border: 1px solid black; padding: 8px; }

        table {width: 400px; border-collapse: collapse; text-align: center; border: 4px solid royalblue;}

        #linha1 {background-color: aqua;}
        #dado1 {background-color: yellowgreen;}
        
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
<!-- Hierarquia de tabelas (simples)

TABLE = TABELA
TR - TABLE ROW = LINHA DE TABELA
TH  - TABLE HEADER = CABEÇALHO DE TABELA
TD - TABLE DATA = DADO DE TABELA
 
-->
<table>
<tr> <!-- Primira linha-->
    <td>a1</td>
    <td>b1</td>
    <td>c1</td>
</tr>
<tr id="linha1">
    <td>a2</td>
    <td>b2</td>
    <td>c2</td>
</tr>
<tr>
    <td id="dado1">a3</td>
    <td>b3</td>
    <td>c3</td>
</tr>
<tr>
    <td>a4</td>
    <td>b4</td>
    <td>c4</td>
</tr>
</table>


</body>
</html>
