<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form002</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
    <p>
        <label for="iuser">Usuário</label>
        <input type="text" name=user id="iuser" required minlength="5" maxlength="20" size="15" placeholder="Seu usuário" autocomplete="username">
    </p>
    <p>
        <label for="password">Senha</label>
        <input type="password" name="password" id="ipassword" required minlength="8" maxlength="30" size="20" placeholder="Sua senha" autocomplete="current-password">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p> </form>
</body>
</html>
